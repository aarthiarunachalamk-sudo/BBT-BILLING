# Keep enough memory for Flutter/AGP compilation without starving Windows and
# the native JVM. The previous 8G heap + 4G metaspace configuration exhausted
# memory on 16 GB development machines and crashed the Gradle daemon.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Xss512k -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Flutter 3.47+ and AGP 9 compile Kotlin directly. Keeping this enabled also
# lets migrated plugins avoid applying the deprecated Kotlin Android plugin.
android.builtInKotlin=true
