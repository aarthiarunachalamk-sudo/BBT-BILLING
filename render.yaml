services:
  - type: web
    name: bbt-billing
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    # Migrations, legacy repairs, and seed setup run once in build.sh. Keeping
    # service startup to Gunicorn makes cold starts reach /api/auth/login much
    # sooner and avoids rewriting seed products on every process restart.
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers $WEB_CONCURRENCY --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /health/
    envVars:
      - key: PIP_DEFAULT_TIMEOUT
        value: "120"
      - key: PIP_RETRIES
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
